<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" width="1060" height="690">
  <foreignObject x="0" y="0" width="1060" height="690">
    <div xmlns="http://www.w3.org/1999/xhtml" style="margin:0; padding:32px 16px; background:#f8fafc; color:#0f172a; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; width:1060px; height:690px; box-sizing:border-box;">
      <style><![CDATA[
  :root{
    --bg:#f8fafc; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --wire:#cbd5e1; --wire-dark:#94a3b8;
    --p1:#4338ca; --p1s:#eef2ff;
    --p2:#0e7490; --p2s:#ecfeff;
    --p3:#b45309; --p3s:#fffbeb;
    --p4:#047857; --p4s:#ecfdf5;
    --shared-bg:#e0e7ff; --shared-bd:#818cf8;
    --policy-bg:#fef3c7; --policy-bd:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:40px 16px; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  h1{text-align:center;font-size:22px;font-weight:650;margin:0 0 6px;letter-spacing:-.01em}
  .subtitle{text-align:center;color:var(--muted);font-size:13px;margin-bottom:32px}
  .wrap{overflow-x:auto}

  .flow{
    position:relative; display:grid;
    grid-template-columns:repeat(4, auto);
    grid-template-rows:auto auto;
    column-gap:44px; align-items:center;
    padding:16px; margin:0 auto; width:max-content;
  }
  .col{position:relative; z-index:1}
  .c-p1{
    grid-column:1; grid-row:1 / 3;
    display:flex; flex-direction:column; align-items:center; gap:36px;
  }
  .c-p2{grid-column:2; grid-row:1 / 3; align-self:stretch; display:flex}
  .c-p3{grid-column:3; grid-row:1; align-self:start}
  .c-p4{grid-column:4; grid-row:1; align-self:start}

  .node{
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; width:190px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .phase-tag{
    display:inline-block; font-size:11px; font-weight:600;
    padding:2px 8px; border-radius:999px;
    color:var(--c); background:var(--cs);
  }
  .title{font-size:15px;font-weight:600;margin:8px 0 4px;line-height:1.35}
  .desc{font-size:12.5px;color:var(--muted);line-height:1.55}

  /* Policies input card */
  .input{
    width:190px; background:#fff;
    border:1px dashed #cbd5e1; border-radius:12px; padding:12px 14px;
  }
  .input-head{display:flex; align-items:center; gap:8px}
  .input .icon{font-size:18px}
  .input .title{margin:0}
  .example{
    margin-top:8px;
    font-size:12px; color:var(--muted); line-height:1.5; font-style:italic;
    display:-webkit-box; -webkit-box-orient:vertical;
    -webkit-line-clamp:4; line-clamp:4; overflow:hidden;
  }

  /* Phase 2 */
  .group{
    flex:1;
    display:flex; flex-direction:column; justify-content:space-between; gap:12px;
    background:#fff; border:1px solid var(--line); border-radius:12px;
    padding:14px 16px;
    box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .group-head{display:flex; align-items:center; gap:8px; padding:0 0 2px}
  .hint{font-size:12px;color:var(--muted)}
  .group .agent{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px;
    background:#f8fafc; border:1px solid var(--line); border-radius:10px;
    box-shadow:none;
  }
  .agent .ico{
    flex:none; width:30px; height:30px; border-radius:8px;
    display:grid; place-items:center; font-size:15px; background:var(--p2s);
  }
  .agent .title{margin:0 0 2px;font-size:14px}

  /* Phase 3 */
  .stack{width:220px}
  .stack-head{margin-bottom:12px}
  .sub{
    background:#f8fafc; border:1px solid var(--line); border-radius:10px;
    padding:10px 12px;
  }
  .sub + .sub{margin-top:26px}
  .sub .title{margin:0 0 2px;font-size:14px}

  /* Sandbox pool: shrink to content, left edge aligned with Phase 3 */
  .pool{
    position:relative; z-index:1;
    grid-column:3 / 5; grid-row:2;
    align-self:end; justify-self:start; width:max-content;
    margin-top:36px;
    background:#f1f5f9; border:1px dashed var(--wire-dark); border-radius:12px;
    padding:14px 16px;
  }
  .pool-head{display:flex; gap:10px; align-items:center; margin-bottom:12px}
  .pool-head .ico{
    flex:none; width:30px; height:30px; border-radius:8px; background:#fff;
    border:1px solid var(--line); display:grid; place-items:center; font-size:15px;
  }
  .pool-head .title{margin:0 0 2px;font-size:14px}

  /* Sandbox cards: width = content, no stretching */
  .sbx-row{display:flex; gap:10px; align-items:stretch}
  .sbx-group{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; text-align:center;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:10px 14px;
  }
  .sbx-label{
    font-size:12px; font-weight:600; line-height:1.4; margin-bottom:8px;
    white-space:nowrap;               /* only break where <br> is */
  }
  .squares{
    margin-top:auto;
    display:flex; justify-content:center; gap:6px;
  }
  .sq{width:22px; height:22px; border-radius:5px; background:var(--bgc); border:1.5px solid var(--bd)}
  .shared{--bgc:var(--shared-bg); --bd:var(--shared-bd)}
  .policy{--bgc:var(--policy-bg); --bd:var(--policy-bd)}

  /* Connectors */
  svg.wires{
    position:absolute; left:0; top:0; width:100%; height:100%;
    pointer-events:none; z-index:2; overflow:visible;
  }
  .wire{
    fill:none; stroke:var(--wire); stroke-width:1.75;
    stroke-dasharray:5 4; animation:flow 1s linear infinite;
  }
  .wire.sandbox{stroke:var(--wire-dark); stroke-width:1.5; stroke-dasharray:none; animation:none}
  @keyframes flow{to{stroke-dashoffset:-9}}

  .legend{display:flex; justify-content:center; flex-wrap:wrap; gap:24px; font-size:12px; color:var(--muted); margin-top:20px}
  .legend span{display:inline-flex; align-items:center; gap:8px}
]]></style>
      

<h1>Multi-Agent Policy Research Pipeline</h1>
<div class="subtitle">Idea Generation → Parallel Research → Distillation &amp; Fact-Checking → Report Synthesis</div>

<div class="wrap">
  <div class="flow" id="flow">

    <svg xmlns="http://www.w3.org/2000/svg" class="wires" id="wires">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1"></path>
        </marker>
        <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"></path>
        </marker>
      </defs>
    <path class="wire" d="M111,218.875 L111,251.875" marker-end="url(#arrow)"></path><path class="wire" d="M206,334.75 C235,334.75 235,157.4765625 264,157.4765625" marker-end="url(#arrow)"></path><path class="wire" d="M206,334.75 C235,334.75 235,305.7734375 264,305.7734375" marker-end="url(#arrow)"></path><path class="wire" d="M206,334.75 C235,334.75 235,425.0078125 264,425.0078125" marker-end="url(#arrow)"></path><path class="wire" d="M457,157.4765625 C494.5,157.4765625 494.5,113.5078125 532,113.5078125" marker-end="url(#arrow)"></path><path class="wire" d="M457,305.7734375 C494.5,305.7734375 494.5,113.5078125 532,113.5078125" marker-end="url(#arrow)"></path><path class="wire" d="M457,409.85546875 C494.5,409.85546875 494.5,113.5078125 532,113.5078125" marker-end="url(#arrow)"></path><path class="wire" d="M628,164.015625 L628,187.015625" marker-end="url(#arrow)"></path><path class="wire" d="M721,230.8359375 L779,230.8359375" marker-end="url(#arrow)"></path><path class="wire sandbox" d="M628,274.65625 L628,319.65625" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"></path><path class="wire sandbox" d="M515,450.26171875 C487.5,450.26171875 487.5,450.26171875 460,450.26171875" marker-start="url(#arrowDark)" marker-end="url(#arrowDark)"></path></svg>

    <!-- Column 1: Policies + Phase 1 -->
    <div class="col c-p1">
      <div class="input" id="input">
        <div class="input-head">
          <span class="icon">📜</span>
          <span class="title">Policies</span>
        </div>
        <div class="example" title="Allow neighborhood groups to adopt an empty city-owned lot to create a garden or small park under a free, renewable agreement. The city keeps ownership of the land. Keep adopted lots as interim green spaces until the land is needed for affordable housing. Give adopting groups at least six months notice before ending an agreement to build on the site.">
          “Allow neighborhood groups to adopt an empty city-owned lot to create a garden or small park under a free, renewable agreement. The city keeps ownership of the land. Keep adopted lots as interim green spaces until the land is needed for affordable housing. Give adopting groups at least six months notice before ending an agreement to build on the site.”
        </div>
      </div>

      <div class="node" id="p1" style="--c:var(--p1);--cs:var(--p1s)">
        <span class="phase-tag">Phase 1</span>
        <div class="title">Idea Generation</div>
        <div class="desc">Generate candidate research ideas from the policies and available resources</div>
      </div>
    </div>

    <!-- Phase 2 -->
    <div class="col c-p2">
      <div class="group">
        <div class="group-head">
          <span class="phase-tag" style="--c:var(--p2);--cs:var(--p2s)">Phase 2</span>
          <span class="hint">Parallel Research</span>
        </div>

        <div class="node agent" id="dc">
          <div class="ico">📊</div>
          <div>
            <div class="title">Data Commons</div>
            <div class="desc">Queries the Data Commons MCP server for demographic, economic, and other statistical data</div>
          </div>
        </div>

        <div class="node agent" id="dr">
          <div class="ico">🔎</div>
          <div>
            <div class="title">Deep Research</div>
            <div class="desc">Queries the Deep Research API</div>
          </div>
        </div>

        <div class="node agent" id="fa">
          <div class="ico">🗂️</div>
          <div>
            <div class="title">File Agent</div>
            <div class="desc">Writes code to analyze 50+ municipal files</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Phase 3 -->
    <div class="col c-p3">
      <div class="node stack" id="p3">
        <div class="stack-head">
          <span class="phase-tag" style="--c:var(--p3);--cs:var(--p3s)">Phase 3</span>
        </div>
        <div class="sub" id="td">
          <div class="title">Takeaway Distillation</div>
          <div class="desc">Merge findings from all three tracks and distill key takeaways</div>
        </div>
        <div class="sub" id="fc">
          <div class="title">Fact-Checking</div>
          <div class="desc">Verify each takeaway against its sources</div>
        </div>
      </div>
    </div>

    <!-- Phase 4 -->
    <div class="col c-p4" id="c-p4" style="transform: translateY(144.211px);">
      <div class="node" id="p4" style="--c:var(--p4);--cs:var(--p4s)">
        <span class="phase-tag">Phase 4</span>
        <div class="title">Report Synthesis &amp; Quality Evaluation</div>
        <div class="desc">Write the final report and evaluate its quality</div>
      </div>
    </div>

    <!-- Managed Agent Sandbox Pool -->
    <div class="pool" id="pool">
      <div class="pool-head">
        <div class="ico">🧰</div>
        <div>
          <div class="title">Managed Agent Sandbox Pool</div>
          <div class="desc">Dedicated and shared sandboxes</div>
        </div>
      </div>
      <div class="sbx-row">
        <div class="sbx-group shared">
          <div class="sbx-label">Shared sandbox</div>
          <div class="squares">
            <div class="sq"></div>
          </div>
        </div>
        <div class="sbx-group policy">
          <div class="sbx-label">Policy-specific,<br/>traceable sandboxes</div>
          <div class="squares">
            <div class="sq"></div><div class="sq"></div><div class="sq"></div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="legend">
  <span><svg xmlns="http://www.w3.org/2000/svg" width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" class="wire"></line></svg>Data flow</span>
  <span><svg xmlns="http://www.w3.org/2000/svg" width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" class="wire sandbox"></line></svg>Sandbox execution</span>
</div>


    </div>
  </foreignObject>
</svg>
